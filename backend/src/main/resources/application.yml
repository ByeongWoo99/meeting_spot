spring:
  application:
    name: meeting-spot

  datasource:
    url: jdbc:postgresql://localhost:5432/meetingspot
    driver-class-name: org.postgresql.Driver
    username: meetingspot_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

kakao:
  api:
    rest-key: ${KAKAO_REST_API_KEY}
    base-url: https://dapi.kakao.com

odsay:
  api:
    key: ${ODSAY_API_KEY}
    base-url: https://api.odsay.com

gemini:
  api:
    key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com

logging:
  file:
    name: logs/app.log
  level:
    com.meetingspot: DEBUG
